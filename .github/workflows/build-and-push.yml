name: Build and push Docker image
on:
  workflow_call:
    outputs:
      image:
        description: "Docker image URI"
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    permissions:
      actions: read # for sarif
      contents: read
      # contents: write # for dependency graph & sarif
      # security-events: write # push sarif to github security
      id-token: write # for nais docker-build-push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # - name: Cache Dependencies
      #   uses: actions/cache@v6
      #   with:
      #     path: ~/.m2/repository
      #     key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      #     restore-keys: ${{ runner.os }}-maven-
      # - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      #   with:
      #     java-version: 25
      #     distribution: temurin
      #     cache: maven
      # - name: Build & package
      #   run: mvn -B package
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com/'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - name: Build & push docker image + SBOM
        uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0
        id: docker-push
        with:
          team: sikkerhetstjenesten
          pull: true
